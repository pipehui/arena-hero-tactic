name: Ubuntu compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Validate Ubuntu scripts
        run: bash -n deploy/ubuntu/install.sh deploy/ubuntu/healthcheck.sh deploy/ubuntu/validate_environment.sh
      - name: Compile and verify dependencies
        run: |
          python -m compileall -q balanced_tactic.py replay_log.py arena_tactic tests
          python -m pip check
